name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop --command bash -c "treefmt --fail-on-change"
      - run: nix develop --command bash -c "ruff check ."
      - run: nix develop --command bash -c "mypy src"
      - run: nix develop --command bash -c "pytest"
