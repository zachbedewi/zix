  - &cocoon age12nz0tyng5l79x4jj3lslwfdcs4y66dx5y7wqs4w03faq5zh6myxq4refjd
  - &eye-of-god age1fw7jg05nhsfccvptknvfltay4ln5hnevlsyq74yzjh3p42hhm9fqhe9vum
  - &fried-egg age1vjjluypq4zl93mlr5qx3znya604dljyjcmlryajryrzxntd5zsrsae2l29
creation_rules:
  # One secret per file: secrets/<user|host|universal>/<name>/secret.yaml.
  # Every secret is decryptable by every machine plus the admin key, same as
  # before this layout existed. Adding a machine means adding its host key
  # here and running `sops updatekeys`.
  - path_regex: secrets/[^/]+/[^/]+/secret\.yaml$
    key_groups:
      - age:
          - *admin
          - *cocoon
          - *eye-of-god
          - *fried-egg
