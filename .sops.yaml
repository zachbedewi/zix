  - &eye-of-god age1fw7jg05nhsfccvptknvfltay4ln5hnevlsyq74yzjh3p42hhm9fqhe9vum
  - &fried-egg age1vjjluypq4zl93mlr5qx3znya604dljyjcmlryajryrzxntd5zsrsae2l29
creation_rules:
  # Per-user secrets. Recipients are the host keys of the machines that user
  # uses, plus the admin key. Users are not identities; adding a machine means
  # adding its host key here and running `sops updatekeys`.
  - path_regex: secrets/users/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *admin
          - *cocoon
          - *eye-of-god
          - *fried-egg
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *admin
          - *cocoon
          - *eye-of-god
          - *fried-egg
